[project]
name = "guess-backend"
version = "0.1.0"
description = "Guess - 赛马竞猜投票平台后端"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["postgres: isolated real PostgreSQL integration tests (requires TEST_DATABASE_URL)"]
